<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartron - Sign Up</title>
    <link rel="icon" type="image/x-icon" href="images\tyre service.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', system-ui, sans-serif;
            scroll-behavior: smooth;
        }

        html {
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg-gradient-1);
            min-height: 100vh;
            color: var(--text-color);
            overflow-y: auto;
            width: 100%;
            transition: background var(--transition), color var(--transition);
            direction: var(--rtl-direction);
            position: relative;
        }

        body.menu-open {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
            top: 0;
            left: 0;
            right: 0;
        }

        :root {
            --bg-gradient-1: #0a0a0a;
            --text-color: #f0f4fc;
            --card-bg: rgba(60, 60, 60, 0.6);
            --card-border: rgba(80, 80, 80, 0.3);
            --shadow: rgba(0, 0, 0, 0.5);
            --btn-hover: #ff6b35;
            --gold: #ff6b35;
            --gold-rgb: 255, 107, 53;
            --badge-color: #ff6b35;
            --badge-bg: rgba(255, 107, 53, 0.15);
            --transition: 0.4s ease;
            --tag-bg: rgba(255, 107, 53, 0.15);
            --tag-border: rgba(255, 107, 53, 0.1);
            --tag-color: var(--gold);
            --rtl-direction: ltr;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] {
            --bg-gradient-1: #f0f2f5;
            --text-color: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(200, 200, 200, 0.3);
            --shadow: rgba(0, 0, 0, 0.08);
            --gold: #d95c2b;
            --gold-rgb: 217, 92, 43;
            --badge-color: #d95c2b;
            --badge-bg: rgba(217, 92, 43, 0.15);
            --tag-bg: rgba(217, 92, 43, 0.12);
            --tag-border: rgba(217, 92, 43, 0.08);
            --tag-color: #d95c2b;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(200, 200, 200, 0.25);
            --input-bg: rgba(0, 0, 0, 0.04);
            --input-border: rgba(0, 0, 0, 0.12);
        }

        [dir="rtl"] {
            --rtl-direction: rtl;
        }

        /* ===== TOP BAR - MINIMAL (NO HEADER BACKGROUND) ===== */
        .top-bar {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            z-index: 999;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 35px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            pointer-events: none;
        }
        .top-bar > * {
            pointer-events: auto;
        }

        .top-bar .top-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .top-bar .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 8px 14px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }
        .top-bar .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--gold);
        }

        .top-bar .rtl-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            padding: 8px 16px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }
        .top-bar .rtl-toggle:hover {
            transform: scale(1.05);
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ============================================
                   SIGN UP SECTION
           ============================================ */
        .signup-section {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 30px;
            background: var(--bg-gradient-1);
        }

        .signup-wrapper {
            width: 100%;
            max-width: 400px;
        }

        /* ===== GLASS MORPHISM SIGN UP CARD ===== */
        .signup-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px 28px 24px;
            box-shadow: 0 20px 60px var(--shadow);
            transition: 0.3s;
            width: 100%;
        }

        .signup-card:hover {
            border-color: var(--gold);
            box-shadow: 0 25px 70px rgba(255, 107, 53, 0.12);
        }

        /* ===== BRAND LOGO INSIDE CARD ===== */
        .signup-card .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--glass-border);
        }
        .signup-card .brand-header .brand-logo {
            font-size: 26px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .signup-card .brand-header .brand-logo i {
            color: var(--gold);
        }

        .signup-card .signup-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .signup-card .signup-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 2px;
        }

        .signup-card .signup-header p {
            font-size: 13px;
            opacity: 0.6;
            color: var(--text-color);
        }

        .signup-card .form-group {
            margin-bottom: 12px;
        }

        .signup-card .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 3px;
        }

        .signup-card .form-group label .required {
            color: var(--gold);
        }

        .signup-card .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .signup-card .form-group .input-wrapper .input-icon {
            position: absolute;
            left: 12px;
            color: var(--text-color);
            opacity: 0.4;
            font-size: 13px;
            transition: 0.3s;
            z-index: 1;
        }

        [dir="rtl"] .signup-card .form-group .input-wrapper .input-icon {
            left: auto;
            right: 12px;
        }

        .signup-card .form-group .input-wrapper .toggle-password {
            position: absolute;
            right: 12px;
            color: var(--text-color);
            opacity: 0.4;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            padding: 0;
            z-index: 2;
        }

        [dir="rtl"] .signup-card .form-group .input-wrapper .toggle-password {
            right: auto;
            left: 12px;
        }

        .signup-card .form-group .input-wrapper .toggle-password:hover {
            opacity: 0.8;
            color: var(--gold);
        }

        /* ===== FIX: ALL INPUTS SAME WIDTH ===== */
        .signup-card .form-group input {
            width: 100%;
            padding: 10px 40px 10px 38px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 13px;
            transition: 0.3s;
            outline: none;
            box-sizing: border-box;
        }

        [dir="rtl"] .signup-card .form-group input {
            padding: 10px 38px 10px 40px;
        }

        .signup-card .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.08);
        }

        .signup-card .form-group input::placeholder {
            color: var(--text-color);
            opacity: 0.35;
        }

        .signup-card .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .signup-card .form-options .agree-terms {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.7;
            cursor: pointer;
        }

        .signup-card .form-options .agree-terms input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .signup-card .form-options .agree-terms a {
            color: var(--gold);
            text-decoration: none;
        }

        .signup-card .form-options .agree-terms a:hover {
            text-decoration: underline;
        }

        .signup-card .signup-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 60px;
            background: var(--gold);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .signup-card .signup-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.3);
        }

        .signup-card .signup-btn i {
            transition: 0.3s;
        }

        .signup-card .signup-btn:hover i {
            transform: translateX(4px);
        }

        [dir="rtl"] .signup-card .signup-btn:hover i {
            transform: translateX(-4px);
        }

        .signup-card .login-link {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-color);
            opacity: 0.7;
        }

        .signup-card .login-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        .signup-card .login-link a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* ===== SOCIAL LOGIN - ROW LAYOUT ===== */
        .signup-card .social-signup {
            margin-top: 16px;
            text-align: center;
        }

        .signup-card .social-signup p {
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.5;
            margin-bottom: 10px;
            position: relative;
        }

        .signup-card .social-signup p::before,
        .signup-card .social-signup p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: var(--input-border);
        }

        .signup-card .social-signup p::before {
            left: 0;
        }

        .signup-card .social-signup p::after {
            right: 0;
        }

        [dir="rtl"] .signup-card .social-signup p::before {
            left: auto;
            right: 0;
        }

        [dir="rtl"] .signup-card .social-signup p::after {
            right: auto;
            left: 0;
        }

        .signup-card .social-signup .social-icons {
            display: flex;
            flex-direction: row;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .signup-card .social-signup .social-icons a {
            flex: 1;
            padding: 8px 6px;
            border-radius: 60px;
            border: 1px solid var(--input-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-color);
            font-size: 12px;
            font-weight: 500;
            transition: 0.3s;
            text-decoration: none;
            opacity: 0.7;
            cursor: pointer;
        }

        .signup-card .social-signup .social-icons a i {
            font-size: 14px;
        }

        .signup-card .social-signup .social-icons a:hover {
            border-color: var(--gold);
            color: var(--gold);
            opacity: 1;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.08);
        }

        .signup-card .social-signup .social-icons a.google-btn i {
            color: #ea4335;
        }

        .signup-card .social-signup .social-icons a.facebook-btn i {
            color: #1877f2;
        }

        .signup-card .social-signup .social-icons a.apple-btn i {
            color: var(--text-color);
        }

        .signup-card .social-signup .social-icons a.google-btn:hover {
            border-color: #ea4335;
            color: #ea4335;
        }

        .signup-card .social-signup .social-icons a.facebook-btn:hover {
            border-color: #1877f2;
            color: #1877f2;
        }

        .signup-card .social-signup .social-icons a.apple-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ============================================
                   RESPONSIVE
           ============================================ */
        @media (max-width: 1024px) {
            .top-bar {
                padding: 0 30px;
                top: 25px;
            }
            .signup-wrapper {
                max-width: 380px;
            }
            .signup-card {
                padding: 24px 24px 20px;
            }
            .signup-card .brand-header {
                margin-bottom: 14px;
                padding-bottom: 12px;
            }
            .signup-card .brand-header .brand-logo {
                font-size: 24px;
            }
            .signup-card .signup-header h1 {
                font-size: 26px;
            }
        }

        @media (max-width: 820px) {
            .top-bar {
                padding: 0 25px;
                top: 20px;
            }
            .signup-wrapper {
                max-width: 360px;
            }
            .signup-card {
                padding: 20px 20px 18px;
                border-radius: 22px;
            }
            .signup-card .brand-header {
                margin-bottom: 12px;
                padding-bottom: 10px;
            }
            .signup-card .brand-header .brand-logo {
                font-size: 22px;
            }
            .signup-card .signup-header h1 {
                font-size: 22px;
            }
            .signup-card .signup-header p {
                font-size: 13px;
            }
            .signup-card .form-group {
                margin-bottom: 10px;
            }
            .signup-card .form-group input {
                padding: 9px 36px 9px 34px;
                font-size: 13px;
            }
            [dir="rtl"] .signup-card .form-group input {
                padding: 9px 34px 9px 36px;
            }
            .signup-card .signup-btn {
                padding: 10px;
                font-size: 14px;
            }
        }

        @media (max-width: 600px) {
            .top-bar {
                padding: 0 16px;
                top: 14px;
            }
            .top-bar .theme-toggle {
                padding: 6px 12px;
                font-size: 14px;
            }
            .top-bar .rtl-toggle {
                padding: 6px 12px;
                font-size: 12px;
            }

            .signup-section {
                padding: 70px 14px 20px;
            }
            .signup-wrapper {
                max-width: 100%;
            }
            .signup-card {
                padding: 18px 16px 16px;
                border-radius: 20px;
            }
            .signup-card .brand-header {
                margin-bottom: 10px;
                padding-bottom: 8px;
            }
            .signup-card .brand-header .brand-logo {
                font-size: 20px;
            }
            .signup-card .signup-header {
                margin-bottom: 14px;
            }
            .signup-card .signup-header h1 {
                font-size: 20px;
            }
            .signup-card .signup-header p {
                font-size: 12px;
            }
            .signup-card .form-group {
                margin-bottom: 8px;
            }
            .signup-card .form-group label {
                font-size: 11px;
            }
            .signup-card .form-group input {
                padding: 8px 34px 8px 32px;
                font-size: 12px;
                border-radius: 8px;
            }
            [dir="rtl"] .signup-card .form-group input {
                padding: 8px 32px 8px 34px;
            }
            .signup-card .form-group .input-wrapper .input-icon {
                font-size: 12px;
                left: 10px;
            }
            [dir="rtl"] .signup-card .form-group .input-wrapper .input-icon {
                left: auto;
                right: 10px;
            }
            .signup-card .form-group .input-wrapper .toggle-password {
                font-size: 12px;
                right: 10px;
            }
            [dir="rtl"] .signup-card .form-group .input-wrapper .toggle-password {
                right: auto;
                left: 10px;
            }
            .signup-card .form-options {
                margin-bottom: 10px;
            }
            .signup-card .form-options .agree-terms {
                font-size: 10px;
            }
            .signup-card .form-options .agree-terms input[type="checkbox"] {
                width: 12px;
                height: 12px;
            }
            .signup-card .signup-btn {
                padding: 9px;
                font-size: 13px;
            }
            .signup-card .login-link {
                font-size: 12px;
                margin-top: 10px;
            }
            .signup-card .social-signup {
                margin-top: 12px;
            }
            .signup-card .social-signup p {
                font-size: 11px;
                margin-bottom: 8px;
            }
            .signup-card .social-signup .social-icons a {
                padding: 6px 4px;
                font-size: 11px;
            }
            .signup-card .social-signup .social-icons a i {
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .top-bar .theme-toggle {
                padding: 5px 10px;
                font-size: 12px;
            }
            .top-bar .rtl-toggle {
                padding: 5px 10px;
                font-size: 11px;
            }

            .signup-card {
                padding: 14px 12px 12px;
                border-radius: 16px;
            }
            .signup-card .brand-header {
                margin-bottom: 8px;
                padding-bottom: 6px;
            }
            .signup-card .brand-header .brand-logo {
                font-size: 18px;
            }
            .signup-card .signup-header h1 {
                font-size: 18px;
            }
            .signup-card .form-group input {
                font-size: 11px;
                padding: 6px 30px 6px 28px;
            }
            [dir="rtl"] .signup-card .form-group input {
                padding: 6px 28px 6px 30px;
            }
            .signup-card .form-group .input-wrapper .input-icon {
                font-size: 11px;
                left: 8px;
            }
            [dir="rtl"] .signup-card .form-group .input-wrapper .input-icon {
                left: auto;
                right: 8px;
            }
            .signup-card .form-group .input-wrapper .toggle-password {
                font-size: 11px;
                right: 8px;
            }
            [dir="rtl"] .signup-card .form-group .input-wrapper .toggle-password {
                right: auto;
                left: 8px;
            }
            .signup-card .signup-btn {
                font-size: 12px;
                padding: 8px;
            }
            .signup-card .social-signup .social-icons {
                gap: 4px;
            }
            .signup-card .social-signup .social-icons a {
                padding: 5px 3px;
                font-size: 10px;
            }
            .signup-card .social-signup .social-icons a i {
                font-size: 11px;
            }
        }

        /* ===== Theme Color Support ===== */
        [data-theme-color="blue"] {
            --gold: #3b82f6;
            --gold-rgb: 59, 130, 246;
            --badge-color: #3b82f6;
            --badge-bg: rgba(59, 130, 246, 0.15);
            --btn-hover: #60a5fa;
        }
        [data-theme-color="green"] {
            --gold: #22c55e;
            --gold-rgb: 34, 197, 94;
            --badge-color: #22c55e;
            --badge-bg: rgba(34, 197, 94, 0.15);
            --btn-hover: #4ade80;
        }
        [data-theme-color="purple"] {
            --gold: #8b5cf6;
            --gold-rgb: 139, 92, 246;
            --badge-color: #8b5cf6;
            --badge-bg: rgba(139, 92, 246, 0.15);
            --btn-hover: #a78bfa;
        }
    </style>
</head>
<body>
    <!-- ===== TOP BAR - MINIMAL (NO HEADER BACKGROUND) ===== -->
    <div class="top-bar">
        <div class="top-controls">
            <button class="rtl-toggle" id="rtlToggle"><span id="desktopRtlLabel">RTL</span></button>
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon" id="toggleIcon"></i></button>
        </div>
    </div>

    <!-- ===== SIGN UP SECTION ===== -->
    <section class="signup-section">
        <div class="signup-wrapper">
            <!-- Glass Morphism Sign Up Card -->
            <div class="signup-card">
                <!-- ===== BRAND LOGO INSIDE CARD ===== -->
                <div class="brand-header">
                    <a href="index.html" class="brand-logo"><i class="fas fa-car"></i> Cartron</a>
                </div>

                <div class="signup-header">
                    <h1>Create Account</h1>
                    <p>Join the Cartron family today</p>
                </div>

                <form id="signupForm" onsubmit="return handleSignup(event)">
                    <div class="form-group">
                        <label for="fullName">Full Name <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="fullName" placeholder="John Doe" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" placeholder="john@example.com" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="phone" placeholder="+1 (800) 555-1234" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" />
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'passwordToggleIcon')">
                                <i class="fas fa-eye" id="passwordToggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-check-circle input-icon"></i>
                            <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', 'confirmToggleIcon')">
                                <i class="fas fa-eye" id="confirmToggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="agree-terms">
                            <input type="checkbox" required /> I agree to the
                            <a href="#">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="signup-btn">
                        Create Account <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="login-link">
                    Already have an account? <a href="login.html">Sign In</a>
                </div>

                <div class="social-signup">
                    <p>Or sign up with</p>
                    <div class="social-icons">
                        <a href="#" class="google-btn" onclick="socialSignup('Google')">
                            <i class="fab fa-google"></i> Google
                        </a>
                        <a href="#" class="facebook-btn" onclick="socialSignup('Facebook')">
                            <i class="fab fa-facebook-f"></i> Facebook
                        </a>
                        <a href="#" class="apple-btn" onclick="socialSignup('Apple')">
                            <i class="fab fa-apple"></i> Apple
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== TOGGLE PASSWORD VISIBILITY =====
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // ===== SIGN UP FORM HANDLER - Direct Redirect to Login Page =====
        function handleSignup(event) {
            event.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Check if passwords match
            if (password !== confirmPassword) {
                alert('❌ Passwords do not match! Please try again.');
                return false;
            }
            
            // Check password length
            if (password.length < 8) {
                alert('❌ Password must be at least 8 characters long!');
                return false;
            }
            
            // Direct redirect to login page without alert
            window.location.href = 'login.html';
            return false;
        }

        // ===== SOCIAL SIGNUP HANDLER - Redirect to Login Page =====
        function socialSignup(platform) {
            // Direct redirect to login page without alert
            window.location.href = 'login.html';
            return false;
        }

        // ===== DARK/LIGHT TOGGLE =====
        const themeToggle = document.getElementById('themeToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        let isDark = true;

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            toggleIcon.className = 'fas fa-sun';
            isDark = false;
        } else {
            toggleIcon.className = 'fas fa-moon';
        }

        themeToggle.addEventListener('click', () => {
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'light');
                toggleIcon.className = 'fas fa-sun';
                localStorage.setItem('theme', 'light');
                isDark = false;
            } else {
                document.documentElement.removeAttribute('data-theme');
                toggleIcon.className = 'fas fa-moon';
                localStorage.setItem('theme', 'dark');
                isDark = true;
            }
        });

        // ===== RTL TOGGLE =====
        const rtlToggle = document.getElementById('rtlToggle');
        const desktopRtlLabel = document.getElementById('desktopRtlLabel');
        let isRTL = false;

        if (localStorage.getItem('rtl') === 'true') {
            document.documentElement.setAttribute('dir', 'rtl');
            isRTL = true;
        }

        function updateRTLState() {
            const label = isRTL ? 'LTR' : 'RTL';
            if (desktopRtlLabel) desktopRtlLabel.textContent = label;
        }

        function toggleRTL() {
            if (isRTL) {
                document.documentElement.removeAttribute('dir');
                localStorage.setItem('rtl', 'false');
                isRTL = false;
            } else {
                document.documentElement.setAttribute('dir', 'rtl');
                localStorage.setItem('rtl', 'true');
                isRTL = true;
            }
            updateRTLState();
        }

        rtlToggle.addEventListener('click', toggleRTL);
        updateRTLState();

        // ===== KEYBOARD SUPPORT - Enter key submits form =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement && activeElement.tagName === 'INPUT') {
                    document.getElementById('signupForm').dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
